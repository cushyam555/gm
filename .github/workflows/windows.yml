name: Test and build Windows app
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GM1-MIDI-Reset run.py
      - uses: actions/upload-artifact@v4
        with:
          name: GM1-MIDI-Reset-Windows
          path: dist/GM1-MIDI-Reset.exe
